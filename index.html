<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaozhi AI Agent - 一键 Web 烧录</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-color: #00f2fe;
            --secondary-color: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 40px 0;
        }

        .container {
            width: 90%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 25px 0;
        }

        .nvs-safe {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        /* 配置控制面板 */
        .config-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            margin-bottom: 20px;
        }

        .config-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            display: block;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-label:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .radio-label.active {
            background: rgba(0, 242, 254, 0.04);
            border-color: rgba(0, 242, 254, 0.2);
        }

        .radio-label input {
            accent-color: var(--accent-color);
        }

        .radio-content {
            display: flex;
            flex-direction: column;
        }

        .radio-name {
            font-size: 14px;
            font-weight: 600;
            color: #f3f4f6;
        }

        .radio-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* esp-web-tools 注入点 */
        esp-web-install-button {
            display: block;
            margin: 0 auto;
            --installer-back-color: transparent;
        }

        .btn-install {
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
        }

        .btn-install:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.4);
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>

<body>

    <div class="container">
        <div class="logo">🤖</div>
        <h1>Xiaozhi AI Agent</h1>
        <p class="desc">极客免驱一键刷机面板。</p>

        <div class="nvs-safe">
            🔒 核心机制：精准覆写特定分区，避免全盘擦除
        </div>

        <!-- 步骤 1: 固件类型 -->
        <div class="config-panel">
            <span class="config-title">1. 选择固件类型 (Firmware)</span>
            <div class="radio-group" id="type-container">
                <label class="radio-label active" data-type="app">
                    <input type="radio" name="firmware" value="app" checked>
                    <div class="radio-content">
                        <span class="radio-name">⚡ 极速更新 App (推荐)</span>
                        <span class="radio-desc">只更新程序包（约5秒），绝对保留 Wi-Fi 及设置</span>
                    </div>
                </label>
                <label class="radio-label" data-type="full">
                    <input type="radio" name="firmware" value="full">
                    <div class="radio-content">
                        <span class="radio-name">📦 完整系统部署</span>
                        <span class="radio-desc">写入 Bootloader、分区表和 App（同样保留NVS）</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- 步骤 2: 资产更换 -->
        <div class="config-panel">
            <span class="config-title">2. 选择资产配置 (Assets)</span>
            <div class="radio-group" id="assets-container">
                <label class="radio-label active" data-asset="default">
                    <input type="radio" name="assets" value="default" checked>
                    <div class="radio-content">
                        <span class="radio-name">🖼️ 默认资产配置 (S3-Box 官方屏幕)</span>
                        <span class="radio-desc">包纳默认包含的图标、离线包、音效</span>
                    </div>
                </label>
                <label class="radio-label" data-asset="custom">
                    <input type="radio" name="assets" value="custom">
                    <div class="radio-content">
                        <span class="radio-name">🎨 自定义包 (Placeholder)</span>
                        <span class="radio-desc">可用于换肤或非标外设资产更新（8MB Offset）</span>
                    </div>
                </label>
                <label class="radio-label" data-asset="none">
                    <input type="radio" name="assets" value="none">
                    <div class="radio-content">
                        <span class="radio-name">🚫 不更新任何资产</span>
                        <span class="radio-desc">只跑固件，完全不触碰 8MB 出厂资产区</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- 核心烧录按钮 -->
        <esp-web-install-button id="install-btn">
            <button class="btn-install" slot="activate">⚡ 一键执行烧录</button>
        </esp-web-install-button>

        <div class="footer">
            Powered by Espressif Web Tools & GitHub Actions
        </div>
    </div>

    <script>
        const installBtn = document.getElementById('install-btn');
        const typeContainer = document.getElementById('type-container');
        const assetsContainer = document.getElementById('assets-container');

        // 单分区 Offset 设定
        const PART_BOOTLOADER = { path: "bootloader.bin", offset: 0 };
        const PART_TABLE = { path: "partition-table.bin", offset: 32768 };
        const PART_OTADATA = { path: "ota_data_initial.bin", offset: 53248 };
        const PART_APP = { path: "xiaozhi.bin", offset: 131072 };

        // 资产包路径绑定
        const PART_ASSETS_DEFAULT = { path: "generated_assets.bin", offset: 8388608 };
        const PART_ASSETS_CUSTOM = { path: "generated_assets.bin", offset: 8388608 }; // 此处为您替换自定义 Bin 的挂接点

        function updateManifest() {
            const fwType = document.querySelector('input[name="firmware"]:checked').value;
            const assetType = document.querySelector('input[name="assets"]:checked').value;

            // 1. 构建 parts 列表
            let parts = [];

            if (fwType === 'full') {
                parts.push(PART_BOOTLOADER, PART_TABLE, PART_OTADATA);
            }
            // 无论 full 还是 app 都要 app bin 
            parts.push(PART_APP);

            // 补充 资产包
            if (assetType === 'default') {
                parts.push(PART_ASSETS_DEFAULT);
            } else if (assetType === 'custom') {
                parts.push(PART_ASSETS_CUSTOM);
            }

            // 2. 组装 Manifest 结构
            const manifestObj = {
                name: "Xiaozhi AI Dynamic installer",
                version: "v1.0-dynamic",
                chipFamily: "ESP32-S3",
                builds: [
                    {
                        chipFamily: "ESP32-S3",
                        parts: parts
                    }
                ]
            };

            // 3. 动态转换 Blob URL 喂给 Button 组件
            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            if (installBtn.hasAttribute('manifest')) {
                URL.revokeObjectURL(installBtn.getAttribute('manifest')); // 释放旧内存
            }
            installBtn.setAttribute('manifest', URL.createObjectURL(blob));
        }

        // 常规样式联动
        function initListeners(container) {
            container.addEventListener('change', (e) => {
                const labels = container.querySelectorAll('.radio-label');
                labels.forEach(lb => {
                    const inp = lb.querySelector('input');
                    lb.classList.toggle('active', inp.checked);
                });
                updateManifest(); // 有变动即刻渲染
            });
        }

        initListeners(typeContainer);
        initListeners(assetsContainer);

        // 初始首次渲染
        updateManifest();

    </script>

</body>

</html>
