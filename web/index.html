<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaozhi AI Agent - 一键 Web 烧录</title>
    <!-- 引入流体现代字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-color: #00f2fe;
            --secondary-color: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(79, 172, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 40px 0;
        }

        .container {
            width: 90%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 25px 0;
        }

        /* 保留设置提示 */
        .nvs-safe {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        /* 配置选择面板 */
        .config-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 18px;
            text-align: left;
            margin-bottom: 30px;
        }

        .config-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 12px;
            display: block;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .radio-label:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
        }

        .radio-label.active {
            background: rgba(0, 242, 254, 0.05);
            border-color: rgba(0, 242, 254, 0.3);
        }

        .radio-label input {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
        }

        .radio-content {
            display: flex;
            flex-direction: column;
        }

        .radio-name {
            font-size: 14px;
            font-weight: 600;
            color: #f3f4f6;
        }

        .radio-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* esp-web-tools 样式贯穿 */
        esp-web-install-button {
            display: block;
            margin: 0 auto;
            --installer-back-color: transparent;
        }

        .btn-install {
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
            width: 100%;
            letter-spacing: 0.5px;
        }

        .btn-install:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 12px 25px rgba(0, 242, 254, 0.5);
        }

        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
    <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</head>

<body>

    <div class="container">
        <div class="logo">🤖</div>
        <h1>Xiaozhi AI Agent</h1>
        <p class="desc">极客免驱版官网。连接电脑点击下方按钮开始轻量级刷机。</p>

        <div class="nvs-safe">
            🔒 核心原理解析：分拆分区烧录，保护本地 NVS 配置/Wi-Fi
        </div>

        <!-- 配置选择器 -->
        <div class="config-panel">
            <span class="config-title">1. 请选择刷机类型</span>
            <div class="radio-group" id="profile-container">

                <label class="radio-label active" data-manifest="./manifest_app.json">
                    <input type="radio" name="profile" value="./manifest_app.json" checked>
                    <div class="radio-content">
                        <span class="radio-name">⚡ 极速更新 App (推荐)</span>
                        <span class="radio-desc">只更新应用程序（约5秒），绝对保留Wi-Fi和密码</span>
                    </div>
                </label>

                <label class="radio-label" data-manifest="./manifest.json">
                    <input type="radio" name="profile" value="./manifest.json">
                    <div class="radio-content">
                        <span class="radio-name">📦 完整系统部署</span>
                        <span class="radio-desc">覆写 App + Assets 静态区（约30秒），同样保留NVS设置</span>
                    </div>
                </label>

            </div>
        </div>

        <!-- 核心烧录按钮组件，动态绑定 manifest -->
        <esp-web-install-button id="install-btn" manifest="./manifest_app.json">
            <button class="btn-install" slot="activate">⚡ 一键执行烧录</button>
        </esp-web-install-button>

        <div class="footer">
            Powered by Espressif Web Tools & GitHub Actions
        </div>
    </div>

    <script>
        // 绑定 Radio Click 联动更新 manifest
        const container = document.getElementById('profile-container');
        const installBtn = document.getElementById('install-btn');
        const labels = document.querySelectorAll('.radio-label');

        container.addEventListener('change', (e) => {
            if (e.target.name === 'profile') {
                const selectedManifest = e.target.value;

                // 更新 Button 容器 manifest 属性
                installBtn.setAttribute('manifest', selectedManifest);

                // 切换样式 active
                labels.forEach(label => {
                    if (label.getAttribute('data-manifest') === selectedManifest) {
                        label.classList.add('active');
                    } else {
                        label.classList.remove('active');
                    }
                });
            }
        });
    </script>

</body>

</html>
