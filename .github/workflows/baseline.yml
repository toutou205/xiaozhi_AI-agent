name: Baseline and Quality Validation

on:
  push:
    branches: [ "feature/ci-practice" ] # 改为实践分支加快测试
  pull_request:
    branches: [ "feature/ci-practice" ]
  workflow_dispatch: # 启用手动触发

jobs:
  build_and_analyze:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.5 # 钉死 v5.5 版本防止环境不一致
    env:
      IDF_CCACHE_ENABLE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # ---------------- 新增：Ccache 缓存加速 ----------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # ---------------- 新增：静态扫描工具链安装 ----------------
      - name: Install Static Analysis Tools
        run: |
          apt-get update
          apt-get install -y cppcheck clang-format ccache

      # ---------------- 新增：代码排版格式化检查 ----------------
      - name: Check Code Formatting (Clang-Format)
        run: |
          # 检查 main 目录下的 .c, .cpp, .h 文件排版
          find main/ -name "*.c" -o -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run -Werror

      # ---------------- 新增：资产虚拟生成 (避免找不到 assets) ----------------
      - name: Create Dummy Assets
        run: |
          mkdir -p scripts/spiffs_assets/build
          touch scripts/spiffs_assets/build/assets.bin

      # ---------------- 新增：Cppcheck 扫描 (极速版) ----------------
      - name: Run Cppcheck (Fast Scan)
        run: |
          # 扫描 main 和自研组件（避开第三方/框架库避免小时级耗时）
          cppcheck --enable=warning --force --inline-suppr --suppress=missingIncludeSystem --suppress=unknownMacro --suppress=unusedFunction --suppress=virtualCallInConstructor --suppress=toomanyconfigs --error-exitcode=1 main/ components/imu_streamer components/sensor_icm42607

      # ---------------- 保持原有：编译固件 ----------------
      - name: Build Project
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build
          
      # ---------------- 保持原有：内存与 Flash 占用分析 ----------------
      - name: Run esp-idf-size (Memory Analysis)
        run: |
          . /opt/esp/idf/export.sh
          # 使用 idf.py size 生成人类可读报告
          idf.py size
          # 额外生成一份 JSON 格式的报告文件用于后续存档或分析
          idf.py size --format=json > size_report.json

      # ---------------- 新增：自动合并二进制文件 ----------------
      - name: Merge Binaries (Using flash_args)
        run: |
          . /opt/esp/idf/export.sh
          cd build
          sed -i 's/--flash_size detect/--flash_size keep/g' flash_args
          esptool.py --chip esp32s3 merge_bin -o merged-firmware.bin @flash_args

      # ---------------- 新增：生成 summary 看板 ----------------
      - name: Generate Visual Markdown Summary
        run: |
          python scripts/visual_report.py size_report.json >> $GITHUB_STEP_SUMMARY

      # ---------------- 新增：归档合并后固件 ----------------
      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-merged-firmware
          path: build/merged-firmware.bin

      # ---------------- 原有：归档分析报告 ----------------
      - name: Upload Size Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-memory-size-report
          path: size_report.json

      # ---------------- 新增：自动部署成果至 GitHub Pages ----------------
      - name: Prepare Website Deploy Folder
        run: |
          mkdir -p deploy
          cp web/index.html deploy/
          cp web/manifest.json deploy/
          cp build/merged-firmware.bin deploy/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: deploy
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
